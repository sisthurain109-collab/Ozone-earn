<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch & Earn Mini App</title>
    <!-- Adsgram Script -->
    <script src="https://sad.adsgram.ai/js/sad-index.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .btn-earn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-earn:active {
            background-color: #2563eb;
        }
        #points {
            margin-top: 15px;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <h1>Watch Ads & Earn</h1>
    <p>ကြော်ငြာကြည့်ပြီး ရမှတ်များ စုဆောင်းပါ</p>
    
    <div id="points">Points: <span id="score">0</span></div>
    <br>
    
    <!-- ကြော်ငြာခေါ်ယူမည့် ခလုတ် -->
    <button onclick="watchAd()" class="btn-earn">Watch Ad</button>

    <script>
        let currentPoints = 0;

        function watchAd() {
            if (!window.Adsgram) {
                alert("Adsgram SDK မပွင့်သေးပါ။ ခဏစောင့်ပါ။");
                return;
            }

            const adController = window.Adsgram.init({ blockId: "53363" });
            
            adController.show().then((result) => {
                currentPoints += 10;
                document.getElementById('score').innerText = currentPoints;
                alert("ကြော်ငြာကြည့်ရှုခြင်း အောင်မြင်ပါသည်။ ၁၀ မှတ် ရရှိသွားပါပြီ။");
            }).catch((result) => {
                alert("ကြော်ငြာ ကြည့်ရှုခြင်း မပြီးဆုံးသေးပါ သို့မဟုတ် အမှားဖြစ်သွားပါသည်။");
            });
        }
    </script>

</body>
</html>
