<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch & Earn Mini App</title>
    <!-- Adsgram Script -->
    <script src="https://sad.adsgram.ai/js/sad-index.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .btn-earn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-earn:active {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <h1>Watch Ads & Earn</h1>
    <p>ကြော်ငြာကြည့်ပြီး ရမှတ်များ စုဆောင်းပါ</p>
    
    <!-- ကြော်ငြာခေါ်ယူမည့် ခလုတ် -->
    <button onclick="watchAd()" class="btn-earn">Watch Ad</button>

    <script>
        // Adsgram Controller ကို သင့် Block ID ဖြင့် ချိတ်ဆက်ခြင်း
        const AdController = window.Adsgram.init({ blockId: "53363" });

        function watchAd() {
            AdController.show().then((result) => {
                // ကြော်ငြာကြည့်ပြီးသွားသောအခါ
                alert("ကြော်ငြာကြည့်ရှုခြင်း အောင်မြင်ပါသည်။ ရမှတ် တိုးပေးလိုက်ပါပြီ။");
            }).catch((result) => {
                // ကြော်ငြာ မပြီးဆုံးမီ ပိတ်လိုက်ခြင်း သို့မဟုတ် အမှားဖြစ်သွားပါက
                alert("ကြော်ငြာ ကြည့်ရှုခြင်း မပြီးဆုံးသေးပါ။");
            });
        }
    </script>

</body>
</html>
